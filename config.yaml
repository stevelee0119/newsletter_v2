# 1차(로컬) 중복 제거 후 LLM에 넘길 카테고리별 후보 상한
candidate_limits:
  special_counsel: 25
  defense: 60
  law: 60
  rulings: 25
  schedule: 15

# 제목 유사도 클러스터링 임계값 (rapidfuzz token_set_ratio, 0~100)
dedupe_threshold: 82

# 서브섹션별 최대 기사 수 (뉴스레터 분량)
section_limits:
  special_counsel: 8
  defense_general: 6
  defense_nk_alliance: 4
  defense_industry: 4
  defense_intl_law: 4
  law_assembly_gov: 5
  law_general: 5
  law_judiciary_agencies: 8
  rulings: 6
  schedules: 6

