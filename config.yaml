# 1차(로컬) 중복 제거 후 LLM에 넘길 카테고리별 후보 상한
candidate_limits:
  special_counsel: 25
  defense: 60
  law: 60
  rulings: 25
  schedule: 15

# 제목 유사도 클러스터링 임계값 (rapidfuzz token_set_ratio, 0~100)
dedupe_threshold: 82

# 보조 중복 판단: 핵심어(2글자 이상 어절) 겹침 비율(overlap coefficient, 0~100).
# 언론사마다 제목을 크게 다르게 쓰는 동일 사건 기사를 token_set_ratio가 놓치는
# 경우를 보완한다. 두 조건 중 하나라도 만족하면 중복으로 판단(OR).
dedupe_overlap_threshold: 40
# 위 겹침 비율 판단에 필요한 최소 공유 핵심어 수(너무 적으면 오탐 위험)
dedupe_min_shared_tokens: 2

# 3번째 중복 판단: 이번 배치 전체에서 드물게 등장하는 단어(예: 인물명·훈련명)를
# 두 제목이 하나라도 공유하면 중복으로 본다. idf = ln((전체건수+1)/(그 단어가
# 등장한 건수+1)) 값이 이 임계값 이상이면 "특이하다"고 판단 — 값이 클수록
# 더 드문 단어만 신호로 인정(오탐 감소), 작을수록 더 공격적으로 병합(누락 감소).
dedupe_distinctive_idf: 3.0

# 서브섹션별 최대 기사 수 (뉴스레터 분량)
