name: daily-newsletter

on:
  schedule:
    # 본 실행: GitHub Actions schedule 이벤트 자체의 지연(수십~90분+, workflow_dispatch보다
    # 훨씬 느린 별도 큐)을 흡수하기 위해 05:27~05:55 KST 사이 4회 분산 시도.
    # main.py generate()가 오늘자 아카이브 존재 시 즉시 스킵하므로 먼저 지연 없이 걸린
    # 하나만 실제로 생성·발송하고 나머지는 1초 내 스킵 — 중복 발송 없음.
    - cron: "27 20 * * *"  # KST 05:27
    - cron: "35 20 * * *"  # KST 05:35
    - cron: "45 20 * * *"  # KST 05:45
    - cron: "55 20 * * *"  # KST 05:55
    # 백업 실행: UTC 21:45 = KST 06:45 (그래도 실패한 경우 마지막 안전망)
    - cron: "45 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate newsletter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.main generate

      - name: Commit newsletter archive
        run: |
          if [ -f out/newsletter.txt ]; then
            git config user.name "newsletter-bot"
            git config user.email "actions@github.com"
            git add newsletters/
            git commit -m "newsletter: $(date +%Y-%m-%d) [skip ci]" || true
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

      - name: Wait and send
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          DELIVERY_MODE: all
          TARGET_SEND_TIME: "06:28"
        run: python -m src.main send
