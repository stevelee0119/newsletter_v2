name: daily-newsletter

on:
  schedule:
    # UTC 21:30 = KST 06:30. 생성 완료 즉시 발송(대기 로직 없음) — GitHub Actions
    # schedule 이벤트 자체가 수십 분~수 시간 지연될 수 있어(workflow_dispatch는
    # 매번 수 초 내 시작되는 것과 대조적으로 실측됨) 정확한 06:30 실행을 보장하진
    # 못하지만, 목표 시각에 맞춰 대기하던 이전 설계보다 더 빨리 전달된다.
    - cron: "30 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: newsletter
  cancel-in-progress: false

jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate newsletter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.main generate

      - name: Commit newsletter archive
        run: |
          if [ -f out/newsletter.txt ]; then
            git config user.name "newsletter-bot"
            git config user.email "actions@github.com"
            git add newsletters/
            git commit -m "newsletter: $(date +%Y-%m-%d) [skip ci]" || true
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi

      - name: Send
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          DELIVERY_MODE: all
        run: python -m src.main send
